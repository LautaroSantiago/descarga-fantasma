<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Descarga Fantasma</title>
<style>
  body {
    width: 320px;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 14px;
    color: #202124;
    background: #fff;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h1 img { width: 20px; height: 20px; }
  button {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 6px;
    background: #4285f4;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 10px;
  }
  button:hover { background: #3367d6; }
  #status {
    font-size: 12px;
    padding: 8px;
    border-radius: 6px;
    background: #f1f3f4;
    margin-bottom: 10px;
  }
  #status.ok { background: #e6f4ea; color: #137333; }
  #status.error { background: #fce8e6; color: #c5221f; }
  h2 {
    font-size: 12px;
    text-transform: uppercase;
    color: #5f6368;
    margin: 12px 0 6px;
  }
  ul { list-style: none; padding: 0; margin: 0; max-height: 220px; overflow-y: auto; }
  li {
    font-size: 12px;
    padding: 6px 0;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.error .name { color: #c5221f; }
  li.ok .name { color: #202124; }
  .empty { font-size: 12px; color: #5f6368; text-align: center; padding: 10px 0; }
</style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="" /> Descarga Fantasma</h1>
  <div id="status">Verificando conexión…</div>
  <button id="connectBtn">Conectar con Google Drive</button>
  <h2>Últimas subidas</h2>
  <ul id="log"></ul>
  <script src="popup.js"></script>
</body>
</html>
